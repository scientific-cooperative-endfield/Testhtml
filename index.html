<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#03050a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Сфера Дайсона · 9 миров</title>
<style>
:root{--acc:#7fd8ff;--bg:rgba(9,13,24,.82);--bd:rgba(140,190,255,.14);--tx:#e8f0ff;--mut:#8ea0bf;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--tx);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
.ui{transition:opacity .3s}
body.noui .ui{opacity:0!important;pointer-events:none!important}
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 0;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#title{flex:1;min-width:0;pointer-events:auto}
#title .nm{font-size:19px;font-weight:700;letter-spacing:.2px;text-shadow:0 1px 8px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title .cl{font-size:12px;color:var(--mut);margin-top:1px;text-shadow:0 1px 6px #000}
#title .md{display:inline-block;margin-top:6px;font-size:11px;padding:2px 9px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--acc);color:var(--acc)}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);display:grid;place-items:center;padding:0;cursor:pointer;flex:0 0 auto}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:#00121c;background:var(--acc);border-color:transparent}
#fps{position:fixed;right:12px;top:calc(var(--st) + 56px);font:11px/1 ui-monospace,Menlo,monospace;color:#9fe0a8;background:rgba(0,0,0,.45);padding:4px 6px;border-radius:6px;pointer-events:none}
#info{position:fixed;left:10px;right:10px;top:calc(var(--st) + 84px);max-height:50vh;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;transform-origin:top;transition:transform .25s,opacity .25s;-webkit-overflow-scrolling:touch;max-width:520px}
#info.hid{opacity:0;transform:scale(.97) translateY(-8px);pointer-events:none}
#info .ih{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#info .ih b{font-size:16px}
#info .ih span{color:var(--mut);font-size:12px}
#info .fact{font-size:12.5px;color:#c6d3ea;margin:6px 0 4px}
#info table{width:100%;border-collapse:collapse;font-size:12.5px}
#info td{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#info td:last-child{text-align:right;color:var(--acc);font-variant-numeric:tabular-nums}
.sec{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);padding:14px 0 4px}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(var(--sb) + 8px);pointer-events:none}
.scroller{display:flex;gap:6px;overflow-x:auto;padding:4px 10px;pointer-events:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:12.5px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);color:#00121c;border-color:transparent;font-weight:600}
.card{flex:0 0 auto;width:92px;padding:8px 8px 7px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;text-align:left;color:var(--tx);position:relative}
.card .dot{width:20px;height:20px;border-radius:50%;margin-bottom:6px}
.card .no{position:absolute;right:8px;top:7px;font-size:10px;color:var(--mut)}
.card .n{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .k{font-size:10.5px;color:var(--mut);white-space:nowrap}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
#dock{display:flex;gap:8px;justify-content:center;padding:6px 10px 0;pointer-events:none}
#dock .ib{width:auto;min-width:44px;padding:0 13px;gap:6px;display:flex;align-items:center;font-size:13px}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:64vh;display:flex;flex-direction:column;background:rgba(7,10,19,.95);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;transform:translateY(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sb);max-width:640px;margin:0 auto;z-index:5}
#sheet.open{transform:none}
#sheetHead{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}
#sheetHead .grab{flex:1;height:22px;display:grid;place-items:center;cursor:pointer}
#sheetHead .grab:before{content:"";width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
#tabs{display:flex;gap:4px;padding:2px 10px 8px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:8px 10px;border-radius:10px;border:0;background:transparent;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:rgba(127,216,255,.13);color:var(--acc)}
#panes{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row .lb{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.row .lb b{font-weight:500}
.row .lb span{color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.row.tg b{font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc) var(--p,50%),rgba(255,255,255,.13) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 1px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}
.sw{position:relative;width:48px;height:28px;flex:0 0 auto}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.15);transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i:after{transform:translateX(20px)}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);padding:8px 2px;border-radius:8px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--acc);color:#00121c;font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0 4px}
.btn{padding:11px 8px;border-radius:12px;border:1px solid var(--bd);background:rgba(127,216,255,.09);color:var(--acc);font-size:13.5px;font-weight:600;cursor:pointer}
.hint{font-size:12px;color:var(--mut);padding:8px 0;line-height:1.45}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0 4px}
.sgrid button{border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--tx);border-radius:12px;padding:9px 4px;cursor:pointer;text-align:center}
.sgrid button b{display:block;font-size:12.5px;font-weight:600}
.sgrid button span{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.sgrid button.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset;background:rgba(255,255,255,.08)}
.sgrid button i{display:block;width:100%;height:3px;border-radius:2px;margin-bottom:6px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:9;transition:opacity .6s;text-align:center;padding:20px}
#loader b{display:block;font-size:17px;letter-spacing:.5px}
#loader span{display:block;color:var(--mut);font-size:12.5px;margin-top:6px}
#loader .ring{width:54px;height:54px;border-radius:50%;border:2px solid rgba(127,216,255,.15);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
#restore{position:fixed;right:12px;bottom:calc(var(--sb) + 12px);display:none;opacity:.55;z-index:4}
body.noui #restore{display:grid}
#toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-30px);background:var(--bg);border:1px solid var(--bd);padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:7;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:760px){#info{left:12px;right:auto;width:400px}.card{width:108px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="top" class="ui">
  <div id="title"><div class="nm">—</div><div class="cl"></div><div class="md"></div></div>
  <button class="ib" id="bInfo" title="Данные"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
  <button class="ib" id="bShot" title="Снимок"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button class="ib" id="bHide" title="Скрыть интерфейс"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<div id="fps" class="ui"></div>
<div id="info" class="ui hid"></div>

<div id="bottom" class="ui">

  <div id="starBar" class="scroller"></div>

    <button class="ib" id="bSet"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Настройки</button>

  </div>
</div>

<div id="sheet" class="ui">
  <div id="sheetHead"><div class="grab" id="grab"></div><button class="ib" id="bClose" style="width:34px;height:34px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="tabs"></div>
  <div id="panes"></div>
</div>

<button class="ib" id="restore" title="Показать интерфейс"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
<div id="toast"></div>
<div id="fade"></div>
<div id="loader"><div><div class="ring"></div><b>Сборка мегаструктуры…</b><span>Компиляция шейдеров и запекание неба</span></div></div>

<script type="importmap">

varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){
  vUv=uv;
  vec4 w=modelMatrix*vec4(position,1.);
  vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal);
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const INST_VS = /* glsl */`
varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying float vId;
void main(){
  vUv=uv;
  mat4 m=modelMatrix*instanceMatrix;
  vec4 w=m*vec4(position,1.);
  vW=w.xyz; vN=normalize(mat3(m)*normal); vId=float(gl_InstanceID);
  gl_Position=projectionMatrix*viewMatrix*w;
}`;
const RIBBON_FS = /* glsl */`
${C}
uniform vec3 uStarCol; uniform float uStarI; uniform float uThermal; uniform float uEdge; uniform vec3 uEdgeCol;
uniform vec3 uHotCol; uniform float uHotVis; uniform vec3 uW; uniform float uSeg;
varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){
  bool outer=gl_FrontFacing;
  vec3 Nn=normalize(vN); if(!outer) Nn=-Nn;
  vec3 L=normalize(-vW); vec3 V=normalize(cameraPosition-vW);
  float ndl=max(dot(Nn,L),0.);
  float s=fract(vUv.x*uSeg);
  float seg=smoothstep(0.,.015,s)*smoothstep(1.,.985,s);
  float rl=smoothstep(.46,.5,abs(fract(vUv.y*4.)-.5));
  float edge=smoothstep(.06,0.,vUv.y)+smoothstep(.94,1.,vUv.y);
  float run=pow(fract(vUv.x*8.-uTime*.08),24.);
  vec3 col;
  if(!outer){
    vec3 H=normalize(L+V);
    col=uStarCol*uStarI*(vec3(.02,.035,.1)*ndl*1.3*seg+pow(max(dot(Nn,H),0.),50.)*1.2)+vec3(.4)*(1.-seg)*ndl*uStarI*.3;
  } else {
    col=vec3(.3,.26,.2)*(.06+.03*rl+.04*max(dot(Nn,V),0.))*uStarI*uStarCol+uHotCol*uHotVis*.8;
    col*=seg*.7+.3;
  }
  col+=uEdgeCol*(edge*(.35+run*2.)+(1.-seg)*.15)*uEdge;
  vec3 o;
  if(uMode==0) o=col;
  else o=fcol(uW.x*uThermal*(outer?1.:1.1)+uW.y*luma(col)*3.+uW.z*(edge+run)*uEdge);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;
const METAL_FS = /* glsl */`
${C}
uniform vec3 uStarCol; uniform float uStarI; uniform float uThermal; uniform vec3 uW; uniform float uLights;
uniform vec3 uHotCol; uniform float uHotVis;
varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying float vId;
void main(){
  vec3 Nn=normalize(vN); vec3 L=normalize(-vW); vec3 V=normalize(cameraPosition-vW);
  float ndl=max(dot(Nn,L),0.);
  vec3 H=normalize(L+V);
  vec3 col=vec3(.5,.52,.56)*(ndl*uStarI*uStarCol*.9+.035)+pow(max(dot(Nn,H),0.),40.)*uStarCol*uStarI*.7;
  col+=uHotCol*uHotVis*.6;
  float h=hash11(vId);
  float blink=step(.82,fract(uTime*.45+h*7.))*uLights;
  float away=pow(max(dot(Nn,-L),0.),3.);
  col+=mix(vec3(.3,.85,1.),vec3(1.,.35,.2),step(.5,h))*blink*away*2.5;
  vec3 o= uMode==0 ? col : fcol(uW.x*uThermal*1.15+uW.y*luma(col)*3.+uW.z*blink*away);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;
const BEAM_FS = /* glsl */`
${C}
uniform vec3 uCol; uniform float uWm; uniform float uInt;
varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying float vId;
void main(){
  vec3 V=normalize(cameraPosition-vW);
  float core=pow(abs(dot(normalize(vN),V)),1.5);
  float f=fract(vUv.y*10.-uTime*1.6+hash11(vId));
  float dash=smoothstep(0.,.08,f)*smoothstep(.6,.25,f);
  float fade=smoothstep(0.,.05,vUv.y)*pow(1.-vUv.y,1.4);
  float I=core*fade*(.35+dash*.9)*uInt*uWm;
  vec3 o= uMode==0 ? uCol*I : fcol(I);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;
const LINE_VS = /* glsl */`
attribute float aT; attribute float aR;
varying float vT; varying float vR;
void main(){ vT=aT; vR=aR; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const LINE_FS = /* glsl */`
${C}
uniform vec3 uCol; uniform float uInt; uniform vec3 uW;
varying float vT; varying float vR;
void main(){
  float dir= vR>.5 ? 1. : -1.;
  float p=pow(fract(vT*dir+vR*7.-uTime*(.25+vR*.3)),22.);
  float I=(.16+p*2.2)*uInt;
  vec3 o= uMode==0 ? uCol*I : fcol((uW.x*.5+uW.y*.2+uW.z*(.25+p*2.))*uInt);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;

/* --- небо: запекание в equirect-текстуру один раз --- */
const BAKE_VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;
const BAKE_FS = /* glsl */`
${N}
varying vec2 vUv;
void main(){
  float lon=(vUv.x-.5)*6.2831853; float lat=(vUv.y-.5)*3.1415926;
  vec3 d=vec3(cos(lat)*cos(lon),sin(lat),cos(lat)*sin(lon));
  float ct=cos(1.05), st=sin(1.05);
  vec3 g=vec3(d.x,ct*d.y-st*d.z,st*d.y+ct*d.z);
  float b=asin(clamp(g.y,-1.,1.)); float l=atan(g.z,g.x);
  float band=exp(-pow(b/.2,2.)); float bandW=exp(-pow(b/.45,2.));
  float bulge=exp(-(pow(b/.28,2.)+pow(l/.6,2.)));
  float n1=fbm(g*3.)*.5+.5;
  float n2=fbm(g*9.+3.)*.5+.5;
  float stars=clamp(band*(.45+.75*n2)*(.6+.6*n1)+bulge*1.1+bandW*.12,0.,1.);
  float dl=1.-abs(fbm(g*5.+7.)); dl=pow(dl,4.);
  float dust=clamp(dl*band*1.6*(.4+n1),0.,1.);
  float em=pow(max(fbm(g*4.+11.),0.),1.5)*band*1.8+pow(max(snoise(g*12.)-.55,0.),2.)*band*6.;
  float cmb=fbm(d*6.+20.)*.5+.5;
  gl_FragColor=vec4(clamp(em,0.,1.),dust,stars,cmb);
}`;
const SKY_VS = `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const SKY_FS = /* glsl */`
${C}
uniform sampler2D uSky; uniform float uSkyI;
varying vec3 vDir;
void main(){
  vec3 d=normalize(vDir);
  vec2 uv=vec2(atan(d.z,d.x)/6.2831853+.5, asin(clamp(d.y,-1.,1.))/3.1415926+.5);
  vec4 s=texture2D(uSky,uv);
  vec3 c;
  if(uMode==0) c=vec3(1.,.92,.82)*s.b*.11*(1.-s.g*.85)+vec3(.9,.25,.35)*s.r*.05*(1.-s.g)+vec3(.25,.35,.6)*.004;
  else if(uMode==1) c=fcol(s.g*.9+s.b*.1)*.35;
  else if(uMode==2) c=fcol(s.b*.5)*.3;
  else if(uMode==3) c=fcol(s.b*.25*(1.-s.g))*.3;
  else if(uMode==4) c=fcol(s.r*.2+.02)*.25;
  else if(uMode==5) c=fcol(s.b*.4)*.3;
  else if(uMode==6) c=fcol(s.b*.4+s.r*.3+.05)*.35;
  else if(uMode==7) c=fcol(s.a*1.2)*.45;
  else c=fcol(s.r*1.2)*.35;
  gl_FragColor=vec4(c*uSkyI,1.);
  ${T_}
}`;
const STARS_VS = /* glsl */`
uniform float uTime; uniform float uDpr;
attribute vec3 aCol; attribute float aSize; attribute float aHot; attribute float aRnd;
varying vec3 vCol; varying float vHot; varying float vTw;
void main(){
  vCol=aCol; vHot=aHot;
  vTw=.8+.2*sin(uTime*(1.5+aRnd*2.)+aRnd*60.);
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
  gl_PointSize=aSize*uDpr;
}`;
const STARS_FS = /* glsl */`
${C}
uniform vec3 uW; uniform float uInt;
varying vec3 vCol; varying float vHot; varying float vTw;
void main(){
  vec2 d=gl_PointCoord-.5; float r=length(d)*2.;
  float a=(exp(-r*r*5.)+exp(-r*18.)*.8)*(1.-smoothstep(.8,1.,r))*vTw*uInt;
  vec3 o= uMode==0 ? vCol*a : fcol(a*luma(vCol)*(uW.x*(1.-vHot)+uW.y*vHot+uW.z)*2.);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;

/* --- квазар --- */
const DISK_VS = /* glsl */`
varying vec3 vL; varying vec3 vW;
void main(){ vL=position; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
const DISK_FS = /* glsl */`
${C}
${N}
uniform float uRin; uniform float uRout; uniform float uInt; uniform float uWm; uniform float uTexp; uniform float uDop; uniform vec3 uNrm;
varying vec3 vL; varying vec3 vW;
float dnoise(vec3 p){ float s=0., a=.5; for(int i=0;i<OCT-1;i++){ s+=a*snoise(p); p=p*2.1+1.3; a*=.5; } return s; }
void main(){
  float r=length(vL.xz);
  float phi=atan(vL.z,vL.x);
  float x=r/uRin;
  // профиль Шакуры–Сюняева
  float prof=pow(x,-.75)*pow(max(1.-sqrt(1./x),0.),.25)*2.2;
  // две фазы потока, чтобы спирали не закручивались бесконечно
  float P=10.;
  float t1=mod(uTime,P), t2=mod(uTime+P*.5,P);
  float wgt=abs(t1/P*2.-1.);
  float om=1.6*pow(x,-1.5);
  float a1=phi+om*t1, a2=phi+om*t2;
  float lr=log(r)*3.;
  float n1=dnoise(vec3(cos(a1)*2.,sin(a1)*2.,lr));
  float n2=dnoise(vec3(cos(a2)*2.,sin(a2)*2.,lr));
  float n=mix(n1,n2,wgt)*.5+.5;
  float I=prof*(.45+1.1*n*n)*smoothstep(uRin*.98,uRin*1.25,r)*(1.-smoothstep(uRout*.55,uRout,r));
  vec3 pw=normalize(vW);
  vec3 vel=normalize(cross(uNrm,pw));
  float beta=min(.62*pow(x,-.5),.85);
  float cosT=dot(vel,normalize(cameraPosition-vW));
  float D=sqrt(1.-beta*beta)/(1.-beta*cosT);
  float boost=mix(1.,clamp(pow(D,3.),.03,12.),uDop);
  float Tt=26000.*prof/2.2*mix(1.,D,uDop);
  vec3 o;
  if(uMode==0) o=bb(Tt)*I*boost*uInt*1.6;
  else o=fcol(uWm*I*boost*pow(max(Tt/15000.,.05),uTexp)*uInt);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;
const LENS_FS = /* glsl */`
${C}
${N}
uniform vec3 uNv; uniform vec2 uAppr; uniform float uInt; uniform float uWm; uniform float uSize; uniform float uDop;
varying vec2 vQ;
void main(){
  float r=length(vQ);
  if(r<1.18) discard;
  vec2 dir=vQ/r;
  float ring=exp(-pow((r-1.32)/.03,2.))*1.4+exp(-pow((r-1.34)/.14,2.))*.3;
  float edgeOn=1.-abs(uNv.z);
  vec2 n2=normalize(uNv.xy+vec2(1e-4,0.));
  float al=abs(dot(dir,n2));
  float arc=smoothstep(1.4,1.75,r)*(1.-smoothstep(2.2,3.6,r));
  float ang=atan(vQ.y,vQ.x);
  float nz=snoise(vec3(cos(ang)*3.,sin(ang)*3.,r*2.-uTime*.4))*.5+.5;
  float lens=arc*pow(al,1.5)*edgeOn*(.4+.9*nz);
  float side=dot(dir,uAppr)*uDop;
  float dop=clamp(1.+.75*side,.15,2.);
  float I=(ring*(.6+.4*edgeOn)+lens*1.1)*dop*(1.-smoothstep(uSize*.7,uSize,r));
  vec3 o= uMode==0 ? bb(11000.*(1.+.25*side))*I*uInt*1.4 : fcol(uWm*I*uInt);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;
const JET_FS = /* glsl */`
${C}
${N}
uniform float uInt; uniform float uWm;
varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){
  vec3 V=normalize(cameraPosition-vW);
  float core=pow(abs(dot(normalize(vN),V)),2.2);
  float a=vUv.y;
  float ang=vUv.x*6.2831853;
  float n=snoise(vec3(cos(ang)*1.5,sin(ang)*1.5,a*26.-uTime*3.))*.5+.5;
  float knots=pow(.5+.5*sin(a*55.-uTime*5.),10.);
  float fade=smoothstep(0.,.02,a)*pow(1.-a,1.3);
  float I=core*fade*(.35+.75*n+knots*.7)*uInt;
  vec3 o= uMode==0 ? mix(vec3(.35,.55,1.),vec3(.9,.95,1.),core)*I*uWm*1.4 : fcol(I*uWm*1.4);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;
const TORUS_FS = /* glsl */`
${C}
${N}
uniform float uOp; uniform float uWm; uniform vec3 uLightCol;
varying vec2 vUv; varying vec3 vN; varying vec3 vW;
void main(){
  vec3 Nn=normalize(vN); vec3 L=normalize(-vW);
  float ndl=max(dot(Nn,L),0.);
  float d=fbm(vW*.12+vec3(0.,uTime*.01,0.))*.5+.5;
  vec3 nat=vec3(.16,.09,.05)*(.08+ndl*1.4)*uLightCol+vec3(.5,.2,.08)*pow(ndl,6.)*.4;
  float al=uOp*(.5+.5*d)*smoothstep(0.,.3,d+.1);
  vec3 o= uMode==0 ? nat*(.6+.6*d) : fcol(uWm*(.25+ndl*1.3)*(.4+d));
  gl_FragColor=vec4(o,al);
  ${T_}
}`;
const BLR_VS = /* glsl */`
uniform float uTime; uniform float uDpr; uniform float uPs;
attribute vec4 aOrb;
varying float vA;
void main(){
  float r=aOrb.x;
  float ang=aOrb.w+uTime*.42*pow(r/4.,-1.5);
  vec3 p=vec3(cos(ang)*r,0.,sin(ang)*r);
  float ci=cos(aOrb.y), si=sin(aOrb.y);
  p=vec3(p.x,p.y*ci-p.z*si,p.y*si+p.z*ci);
  float cn=cos(aOrb.z), sn=sin(aOrb.z);
  p=vec3(cn*p.x+sn*p.z,p.y,-sn*p.x+cn*p.z);
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=clamp(uPs*uDpr*60./max(-mv.z,.1),1.,40.);
  vA=.6+.4*sin(uTime*2.+aOrb.w*9.);
}`;
const BLR_FS = /* glsl */`
${C}
uniform float uWm; uniform float uInt;
varying float vA;
void main(){
  vec2 d=gl_PointCoord-.5; float r=length(d)*2.;
  float a=exp(-r*r*4.)*(1.-smoothstep(.7,1.,r))*vA;
  vec3 o= uMode==0 ? vec3(1.,.55,.6)*a*uWm*uInt : fcol(a*uWm*uInt);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;
const COIL_FS = /* glsl */`
${C}
uniform vec3 uStarCol; uniform float uStarI; uniform float uWm; uniform float uCount; uniform float uEm;
varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying float vId;
void main(){
  vec3 Nn=normalize(vN); vec3 L=normalize(-vW); vec3 V=normalize(cameraPosition-vW);
  float ndl=max(dot(Nn,L),0.);
  vec3 H=normalize(L+V);
  float k=mod(vId,uCount)/uCount;
  float p=pow(fract(k-uTime*.45),6.);
  vec3 col=vec3(.45,.47,.52)*(ndl*uStarI*uStarCol*.8+.03)+pow(max(dot(Nn,H),0.),40.)*uStarCol*uStarI*.6;
  col+=mix(vec3(.25,.65,1.),vec3(1.,.3,.85),k)*(.18+p*2.6)*uEm;
  vec3 o= uMode==0 ? col : fcol(uWm*(.15+p*2.)*uEm+luma(col)*.2);
  gl_FragColor=vec4(o,1.);
  ${T_}
}`;

/* =====================================================================
   РЕНДЕРЕР, СЦЕНА, КАМЕРА
   ===================================================================== */
const canvas = $('#c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: Q().msaa > 0, powerPreference: 'high-performance', stencil: false });
} catch (e) {
  $('#loader').innerHTML = '<div><b>WebGL 2 недоступен</b><span>Откройте страницу в свежем Chrome / Safari</span></div>';
  throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = S.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
let dpr = Math.min(S.maxDpr, Q().dpr, window.devicePixelRatio || 1);
renderer.setPixelRatio(dpr);
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(S.fov, innerWidth / innerHeight, .02, 4000);
camera.position.set(0, 2.2, 10);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.rotateSpeed = .6; controls.zoomSpeed = .9; controls.enablePan = false;
controls.autoRotate = S.autoRot; controls.autoRotateSpeed = S.rotSpeed;

/* Общие uniform-объекты: одно изменение — во всех материалах */
const G = {
  uTime:{value:0}, uMode:{value:0}, uGain:{value:S.gain},
  uP0:{value:new THREE.Vector3()}, uP1:{value:new THREE.Vector3()}, uP2:{value:new THREE.Vector3()}, uP3:{value:new THREE.Vector3()},
};
const ALL = [];
const REG = [];
function SM(vs, fs, u = {}, o = {}) {
  const m = new THREE.ShaderMaterial(Object.assign({ vertexShader:vs, fragmentShader:fs, uniforms:Object.assign({}, G, u), defines:{ OCT:Q().oct } }, o));
  ALL.push(m); return m;
}
const reg = (mat, key, table) => REG.push({ mat, key, table });
const ADD = { transparent:true, blending:THREE.AdditiveBlending, depthWrite:false };
const V3 = () => ({ value:new THREE.Vector3() });
const mkLight = () => ({
  uStarCol:{value:new THREE.Color(1,1,1)}, uStarI:{value:1}, uThermal:{value:1},
  uHotCol:{value:new THREE.Color(1,.5,.2)}, uHotVis:{value:0},
  uEdge:{value:S.edge}, uEdgeCol:{value:new THREE.Color(.3,.75,1)},
});
const LS = mkLight(), LQ = mkLight();
LQ.uEdgeCol.value.set(.75,.5,1);

/* --- фон --- */
const skyGroup = new THREE.Group(); scene.add(skyGroup);
const skyMat = SM(SKY_VS, SKY_FS, { uSky:{value:null}, uSkyI:{value:S.skyI} }, { side:THREE.BackSide, depthWrite:false, depthTest:false });
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false; skyGroup.add(sky);
let skyRT = null;
function bakeSky() {
  const w = Math.min(Q().sky, renderer.capabilities.maxTextureSize);
  if (skyRT) skyRT.dispose();
  skyRT = new THREE.WebGLRenderTarget(w, w / 2, { depthBuffer:false });
  const m = new THREE.ShaderMaterial({ vertexShader:BAKE_VS, fragmentShader:BAKE_FS, defines:{ OCT:6 }, depthTest:false, depthWrite:false });
  const sc = new THREE.Scene(), qd = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), m);
  qd.frustumCulled = false; sc.add(qd);
  renderer.setRenderTarget(skyRT);
  renderer.render(sc, new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1));
  renderer.setRenderTarget(null);
  m.dispose(); qd.geometry.dispose();
  skyMat.uniforms.uSky.value = skyRT.texture;
}
const starsMat = SM(STARS_VS, STARS_FS, { uDpr:{value:dpr}, uW:V3(), uInt:{value:1} }, ADD);
reg(starsMat, 'uW', W.bgst);
let bgStars = null;
function buildStarfield() {
  if (bgStars) { skyGroup.remove(bgStars); bgStars.geometry.dispose(); }
  const n = Q().stars, R = rng(7);
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), size = new Float32Array(n), hot = new Float32Array(n), rnd = new Float32Array(n);
  const v = new THREE.Vector3(), c = new THREE.Color(), ct = Math.cos(1.05), st = Math.sin(1.05);
  for (let i = 0; i < n; i++) {
    randUnit(R, v);
    if (R() < .5) for (let k = 0; k < 8; k++) { const gy = ct * v.y - st * v.z; if (R() < Math.exp(-((gy / .22) ** 2))) break; randUnit(R, v); }
    pos.set([v.x * 800, v.y * 800, v.z * 800], i * 3);
    const T = R() < .7 ? 2800 + R() * 3400 : 6000 + Math.pow(R(), 2) * 22000;
    bbC(T, c);
    const b = .22 + Math.pow(R(), 14) * 3.2;
    col.set([c.r * b, c.g * b, c.b * b], i * 3);
    size[i] = 1.2 + Math.pow(R(), 10) * 4.2;
    hot[i] = clamp01((T - 3000) / 15000);
    rnd[i] = R();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aHot', new THREE.BufferAttribute(hot, 1));
  g.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 1));
  bgStars = new THREE.Points(g, starsMat);
  bgStars.frustumCulled = false; bgStars.renderOrder = -9;
  bgStars.visible = S.bgStars;
  skyGroup.add(bgStars);
}

/* =====================================================================
   ЗВЕЗДА И ЕЁ МЕГАСТРУКТУРА
   ===================================================================== */
const starRoot = new THREE.Group(); scene.add(starRoot);
const structGroup = new THREE.Group(); starRoot.add(structGroup);
const frameGroup = new THREE.Group(); structGroup.add(frameGroup);

      const inc = type === 'rings' ? (i + .5) / k * Math.PI : [0, .5, .5][i];
      const node = type === 'rings' ? i * 2.39996 : [0, 0, Math.PI][i];

      const cc = randUnit(R, new THREE.Vector3());

    }) : null;
    for (let j = 0; j < nSwarm; j++) {
      const rm = 1 + (j % L) * .13 + (R() - .5) * .03;
      if (cl && R() < .82) {
        const k = cl[(R() * cl.length) | 0];

  if (!q) {
    h += row('Спектральный класс', st.cls) + row('Температура', st.T.toLocaleString('ru-RU') + ' K') + row('Радиус', sci(st.R) + ' R☉')
      + row('Светимость', sci(st.L) + ' L☉') + row('Масса', sci(st.M) + ' M☉') + row('Расстояние', st.dist)
      + row('Пик излучения', Math.round(2.898e6 / st.T) + ' нм');
    if (st.R !== 1) h += row('Солнце в масштабе', st.R > 1 ? '1/' + sci(st.R, 1) : '×' + sci(1 / st.R, 1));
    h += '</table><div class="sec">Мегаструктура</div><table>';
    const r = shellAU(), T = shellTemp(), P = st.L * 3.828e26 * cov, area = 4 * Math.PI * Math.pow(r * 1.496e11, 2) * cov;
    h += row('Тип', { swarm:'Рой Дайсона', rings:'Кольца Дайсона', shell:'Оболочка', hybrid:'Гибрид' }[S.type])
      + row('Радиус (реальный)', sci(r) + ' а.е.') + row('Температура радиаторов', Math.round(T) + ' K')
      + row('Пик теплового излучения', (2898 / T).toFixed(1) + ' мкм') + row('Перехват света', (cov * 100).toFixed(1) + '%')
      + row('Мощность', sci(P) + ' Вт') + row('Уровень Кардашёва', P > 0 ? ((Math.log10(P) - 6) / 10).toFixed(2) : '—')
      + row('Площадь коллекторов', sci(area / 1e6) + ' км²') + row('Масса (1 кг/м²)', sci(area) + ' кг')
      + row('Панелей на экране', (swarm ? swarm.geometry.instanceCount : 0).toLocaleString('ru-RU'));
  } else {
    const Lq = 4e12, rAU = 53 * 600, P = Lq * 3.828e26 * (cov + .08 * S.jetI);
    h += row('Масса дыры', '8.9·10⁸ M☉') + row('Радиус Шварцшильда', '≈17.5 а.е.') + row('Светимость', '≈4·10¹² L☉')
      + row('Красное смещение', 'z = 0.158') + row('Расстояние', st.dist);
    h += '</table><div class="sec">Двигатель Пенроуза–Кардашёва</div><table>';
    h += row('Состав', 'рой + 3 кольца + сопла') + row('Радиус колеса (реальный)', '≈' + sci(rAU, 1) + ' а.е.')
      + row('Температура радиаторов', '≈2200 K') + row('Перехват диска', (cov * 100).toFixed(1) + '%')
      + row('Отбор энергии джетов', (8 * S.jetI).toFixed(0) + '%') + row('Мощность', sci(P) + ' Вт')
      + row('Уровень Кардашёва', P > 0 ? ((Math.log10(P) - 6) / 10).toFixed(2) : '—')
      + row('Коллекторов на экране', (qParts.swarm ? qParts.swarm.geometry.instanceCount : 0).toLocaleString('ru-RU'));
  }
  h += `</table><div class="sec">Спектр · ${MODES[S.mode].name}</div><div class="fact">${(q ? MDQ : MDS)[S.mode]}</div>`;
  infoEl.innerHTML = h;
}

const sheet = $('#sheet');
$('#bSet').onclick = () => sheet.classList.toggle('open');
$('#bClose').onclick = $('#grab').onclick = () => sheet.classList.remove('open');
$('#bInfo').onclick = () => { infoEl.classList.toggle('hid'); $('#bInfo').classList.toggle('on', !infoEl.classList.contains('hid')); updateInfo(); };
$('#bShot').onclick = () => { wantShot = true; };
$('#bHide').onclick = () => hideUI(true);
$('#restore').onclick = () => hideUI(false);
$('#bPlay').onclick = () => { S.paused = !S.paused; syncAll(); };
$('#bCine').onclick = () => { S.cinema = !S.cinema; setCinema(S.cinema); syncAll(); };
$('#bReset').onclick = () => resetView();
function hideUI(v) { document.body.classList.toggle('noui', v); if (v) sheet.classList.remove('open'); }
function resetView() {
  S.cinema = false; setCinema(false); syncAll();
  const d = fitDist();
  camera.position.set(0, d * .22, d);
  controls.target.set(0, 0, 0); controls.update(); flyTo = null;
}
function resetAll() {
  const keep = { star:S.star, mode:S.mode };
  Object.assign(S, DEF, keep);
  renderer.toneMappingExposure = S.exposure; G.uGain.value = S.gain;
  skyMat.uniforms.uSkyI.value = S.skyI; starsMat.uniforms.uInt.value = 1; sky.visible = S.sky; ghost.visible = S.ghost;
  LS.uEdge.value = LQ.uEdge.value = S.edge;
  controls.autoRotate = S.autoRot; controls.autoRotateSpeed = S.rotSpeed; camera.fov = S.fov; camera.updateProjectionMatrix();
  applyQuality(); applyStar(S.star, true); toast('Настройки сброшены');
}
let cineT = 0;
function setCinema(v) { controls.enabled = !v; }

// жесты: двойной тап — сброс вида, касание — выход из кинорежима
let lastTap = 0, downPos = null;
canvas.addEventListener('pointerdown', e => {
  downPos = [e.clientX, e.clientY];
  if (S.cinema) { S.cinema = false; setCinema(false); syncAll(); }
  flyTo = null;
});
canvas.addEventListener('pointerup', e => {
  if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 12) return;
  const now = performance.now();
  if (now - lastTap < 320) { resetView(); lastTap = 0; } else lastTap = now;
  if (sheet.classList.contains('open') && e.pointerType === 'touch') sheet.classList.remove('open');
});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) switchStar(n - 1);
  else if (e.key === 's' || e.key === 'S' || e.key === 'ы') applyMode((S.mode + 1) % MODES.length);
  else if (e.key === 'h' || e.key === 'H' || e.key === 'р') hideUI(!document.body.classList.contains('noui'));
  else if (e.key === ' ') { S.paused = !S.paused; syncAll(); e.preventDefault(); }
});
document.addEventListener('visibilitychange', () => { last = performance.now(); });

/* =====================================================================
   ЦИКЛ
   ===================================================================== */
let frames = 0, fpsT = 0, goodSec = 0, firstFrame = true;
const _sph = new THREE.Spherical(), _nW = new THREE.Vector3(0, 1, 0), _tc = new THREE.Vector3(), _e = new THREE.Vector3(), _vel = new THREE.Vector3(), _nv = new THREE.Vector3();

function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min((now - last) / 1000, .1); last = now;
  const ts = S.paused ? 0 : S.timeScale;
  G.uTime.value += dt * ts;
  orb += dt * ts * S.orbit;
  const st = STARS[S.star], q = st.id === 'quasar';
  if (!q) starT += dt * ts * S.conv * st.conv;

  if (buildAnim) { buildCur = Math.min(S.build, buildCur + dt * Math.max(ts, .3) * .09); if (buildCur >= S.build) buildAnim = false; }
  else buildCur += (S.build - buildCur) * Math.min(1, dt * 4);
  panelMat.uniforms.uBuild.value = qPanelMat.uniforms.uBuild.value = buildCur;
  panelMat.uniforms.uOrb.value = qPanelMat.uniforms.uOrb.value = orb;
  starMat.uniforms.uST.value = starT;

  if (!q) {
    frameGroup.rotation.y = orb * (S.type === 'shell' ? SHELL_SPEED : .05);
    for (const r of ribbons) { _q.setFromAxisAngle(Yax, orb * RING_SPEED * Math.pow(1 + r.userData.i * .012, -1.5)); r.quaternion.copy(r.userData.q).multiply(_q); }
  } else if (qParts.wheel) {
    qParts.wheel.rotation.y = orb * .015;
  }

  if (S.cinema) {
    cineT += dt;
    _sph.setFromVector3(camera.position);
    _sph.theta += dt * .12;
    _sph.phi = THREE.MathUtils.lerp(_sph.phi, Math.PI / 2 - .15 + Math.sin(cineT * .13) * .55, dt * .5);
    _sph.radius = THREE.MathUtils.lerp(_sph.radius, fitDist() * (.55 + .55 * (.5 + .5 * Math.sin(cineT * .09))), dt * .4);
    _sph.makeSafe();
    camera.position.setFromSpherical(_sph); camera.lookAt(0, 0, 0);
  } else {
    if (flyTo) {
      const d = camera.position.length(), nd = THREE.MathUtils.lerp(d, flyTo, 1 - Math.exp(-dt * 3));
      camera.position.setLength(nd);
      if (Math.abs(nd - flyTo) < flyTo * .005) flyTo = null;
    }
    controls.update();
  }
  camera.updateMatrixWorld();
  skyGroup.position.copy(camera.position);

  // линзирование: нормаль диска и приближающаяся сторона в экранных координатах
  if (q) {
    _nv.copy(_nW).transformDirection(camera.matrixWorldInverse);
    lensMat.uniforms.uNv.value.copy(_nv);
    _tc.copy(camera.position).normalize();
    _e.crossVectors(_tc, _nW); if (_e.lengthSq() < 1e-6) _e.set(1, 0, 0); _e.normalize();
    _vel.crossVectors(_nW, _e);
    if (_vel.dot(_tc) < 0) _e.negate();
    _e.transformDirection(camera.matrixWorldInverse);
    lensMat.uniforms.uAppr.value.set(_e.x, _e.y).normalize();
  }

  if (S.bloom) composer.render(); else renderer.render(scene, camera);

  if (wantShot) {
    wantShot = false;
    canvas.toBlob(b => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `dyson-${st.id}-${Date.now()}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Снимок сохранён'); });
  }
  if (firstFrame) { firstFrame = false; const l = $('#loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); }

  frames++; fpsT += dt;
  if (fpsT >= 1) {
    const fps = frames / fpsT; frames = 0; fpsT = 0;
    if (S.fps) $('#fps').textContent = `${fps.toFixed(0)} fps · ${dpr.toFixed(2)}x`;
    if (S.adaptive) {
      if (fps < 42 && dpr > .6) { setDpr(dpr - .15); goodSec = 0; }
      else if (fps > 57) { if (++goodSec >= 3 && dpr < Math.min(S.maxDpr, Q().dpr, window.devicePixelRatio || 1) - .01) { setDpr(dpr + .1); goodSec = 0; } }
      else goodSec = 0;
    }
    if (!infoEl.classList.contains('hid')) updateInfo();
  }
}

/* =====================================================================
   СТАРТ
   ===================================================================== */
sky.visible = S.sky;
skyMat.uniforms.uSkyI.value = S.skyI;
buildStarfield(); bakeSky(); buildFrame(); buildComposer();
applyStar(S.star, false);
resetView();
syncAll();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
</html>
